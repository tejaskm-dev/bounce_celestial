# A string used to distinguish different Supabase projects on the same host.
project_id = "bounce-arcade"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["https://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.anonymous_users]
enabled = true

[edge_runtime]
enabled = true
port = 54323
policy = "per_worker"
